spring.application.name=habit-tracker-backend
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/habit_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MySQL@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:HabitTrackerJwtSecretKeyForDevelopmentOnlyChangeMe123456789}
app.jwt.expiration-ms=86400000

spring.sql.init.mode=never
