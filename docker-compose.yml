services:
  mysql:
    image: mysql:8.4
    container_name: habit-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: habit_tracker
      MYSQL_ROOT_PASSWORD: mysql267
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ..
      dockerfile: habit-tracker-deployment/backend.Dockerfile
    container_name: habit-tracker-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_USERNAME: root
      DB_PASSWORD: mysql267
      JWT_SECRET: HabitTrackerJwtSecretKeyForDockerDevelopment123456789
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: habit-tracker-deployment/frontend.Dockerfile
    container_name: habit-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
